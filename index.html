<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kolase Foto By Aditya Hermansyah</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
      body {
        background: radial-gradient(circle at top, #1e293b, #020617);
        min-height: 100vh;
      }

      /* Wrapper mengikuti lebar konten agar tidak lebar sendirian di Desktop */
      #collageWrapper {
        width: fit-content;
        max-width: 95vw;
        margin-left: auto;
        margin-right: auto;
      }

      /* Pengaturan Grid Preview */
      #collage {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap; /* Tetap satu baris */
        gap: 5px;
        padding: 10px;
        width: fit-content;
      }

      .image-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      /* Logika agar 4 foto muat di HP tanpa scroll */
      .collage-item {
        width: 21vw; /* 4 foto x 21% = 84% layar, sisa untuk gap & padding */
        height: auto;
        max-width: 200px; /* Batas maksimal di Desktop */
        max-height: 400px;
        object-fit: contain;
        border-radius: 4px;
      }

      /* Penyesuaian untuk layar Desktop agar tidak terlalu kecil */
      @media (min-width: 640px) {
        .collage-item {
          width: auto;
          min-width: 100px;
          max-width: 250px;
        }
        #collage {
          gap: 10px;
        }
      }

      .delete-btn {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        cursor: pointer;
        border: 2px solid white;
        z-index: 20;
      }
    </style>
  </head>

  <body class="text-white flex flex-col items-center px-4 pb-12 relative">
    <header class="text-center mt-10 mb-8">
      <h1 class="text-2xl md:text-4xl font-bold text-pink-400 px-2">
        Welcome To Kolase Foto By Aditya Hermansyah
      </h1>
      <p class="text-xs md:text-sm text-gray-300 mt-2">
        Kolase Foto Dengan Mudah Dan Simple Tanpa Terpotong.
      </p>
    </header>

    <div
      class="w-full max-w-xl border border-dashed border-pink-400/40 rounded-xl p-6 text-center mb-8 bg-slate-900/50"
    >
      <p class="text-sm mb-2">
        Cara 1: Copy Gambar & Tekan
        <span class="bg-blue-600 px-2 py-1 rounded text-xs">Ctrl + V</span>
      </p>
      <p class="text-gray-500 my-2 text-xs">ATAU</p>
      <label
        class="inline-flex items-center gap-2 bg-pink-500/20 hover:bg-pink-500/30 border border-pink-400 px-5 py-2.5 rounded-full cursor-pointer transition-all active:scale-95"
      >
        <span>📁 Pilih Foto Manual</span>
        <input type="file" id="fileInput" multiple accept="image/*" hidden />
      </label>
      <p class="text-xs text-gray-400 mt-4">
        Foto terpilih:
        <span id="counter" class="font-bold text-pink-400">0</span>/4
      </p>
    </div>

    <div
      id="collageWrapper"
      class="bg-white rounded-xl shadow-2xl mb-8 overflow-hidden"
    >
      <div id="collage">
        <div id="placeholder" class="text-gray-400 italic text-sm py-10 px-10">
          Belum ada foto
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 w-full max-w-xs sm:max-w-md">
      <button
        onclick="download('png')"
        class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-semibold shadow-lg transition-all"
      >
        Download PNG
      </button>
      <button
        onclick="download('jpg')"
        class="flex-1 bg-red-500 hover:bg-red-600 py-3 rounded-xl font-semibold shadow-lg transition-all"
      >
        Download JPG
      </button>
    </div>

    <div
      id="downloadPopup"
      class="fixed top-5 right-5 left-5 sm:left-auto bg-white text-gray-900 px-6 py-4 rounded-xl shadow-2xl flex items-center space-x-4 max-w-xs opacity-0 pointer-events-none z-50 transition-all duration-500 transform translate-x-full"
    >
      <div class="bg-green-500 text-white p-1 rounded-full">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M5 13l4 4L19 7"
          />
        </svg>
      </div>
      <div>
        <p class="font-bold text-sm">Download Berhasil!</p>
        <p class="text-[10px] text-gray-500">Halaman akan dimuat ulang...</p>
      </div>
    </div>

    <script>
      const config = { max: 4 };
      const collage = document.getElementById("collage");
      const counter = document.getElementById("counter");
      const fileInput = document.getElementById("fileInput");
      const collageWrapper = document.getElementById("collageWrapper");
      const popup = document.getElementById("downloadPopup");
      let images = [];

      function addImage(src) {
        if (images.length >= config.max) return;

        const placeholder = document.getElementById("placeholder");
        if (placeholder) placeholder.remove();

        const imageId = `img-${Date.now()}`;
        const wrapper = document.createElement("div");
        wrapper.className = "image-container";
        wrapper.id = imageId;

        const img = document.createElement("img");
        img.src = src;
        img.className = "collage-item shadow-sm";

        const delBtn = document.createElement("div");
        delBtn.innerHTML = "✕";
        delBtn.className = "delete-btn";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          removeImage(imageId);
        };

        wrapper.appendChild(img);
        wrapper.appendChild(delBtn);
        collage.appendChild(wrapper);
        images.push({ id: imageId, src: src });
        updateCounter();
      }

      function removeImage(id) {
        document.getElementById(id).remove();
        images = images.filter((img) => img.id !== id);
        if (images.length === 0) {
          collage.innerHTML =
            '<div id="placeholder" class="text-gray-400 italic text-sm py-10 px-10">Belum ada foto</div>';
        }
        updateCounter();
      }

      function updateCounter() {
        counter.textContent = images.length;
      }

      fileInput.addEventListener("change", () => {
        [...fileInput.files].forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => addImage(e.target.result);
          reader.readAsDataURL(file);
        });
      });

      document.addEventListener("paste", (e) => {
        const items = e.clipboardData.items;
        for (let item of items) {
          if (item.type.includes("image")) {
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = (e) => addImage(e.target.result);
            reader.readAsDataURL(file);
          }
        }
      });

      async function download(type) {
        if (images.length === 0) return alert("Pilih foto dulu!");

        const deleteButtons = document.querySelectorAll(".delete-btn");
        deleteButtons.forEach((btn) => (btn.style.display = "none"));

        const canvas = await html2canvas(collageWrapper, {
          scale: 5,
          useCORS: true,
          backgroundColor: "#ffffff",
        });

        const mime = type === "jpg" ? "image/jpeg" : "image/png";
        const fileName = `kolase-aditya-${Date.now()}.${type}`;

        canvas.toBlob(
          async (blob) => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(
              navigator.userAgent,
            );

            if (!isMobile && window.showSaveFilePicker) {
              try {
                const handle = await window.showSaveFilePicker({
                  suggestedName: fileName,
                  types: [{ accept: { [mime]: [`.${type}`] } }],
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                showPopup();
              } catch (err) {
                deleteButtons.forEach((btn) => (btn.style.display = "flex"));
              }
            } else {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = fileName;
              a.click();
              showPopup();
            }
          },
          mime,
          1.0,
        );
      }

      function showPopup() {
        popup.style.opacity = "1";
        popup.style.transform = "translateX(0)";
        setTimeout(() => location.reload(), 2500);
      }
    </script>
  </body>
</html>
